<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="nebbia: neverending dub techno. A mix generated live in your browser that never plays the same way twice.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>nebbia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
/* Layout: one quiet column, like sempre, lamiera and deriva. The dial is the whole instrument: two rings are the two decks, tap it to start and stop */
:root{
  --bg:#02040F; --ink:#E5DADA; --mute:#968E96; --line:#152139; --amber:#E59500; --wine:#D2577F; --night:#4A8CC4;
  --font:"Helvetica Neue","IBM Plex Sans",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
#bench{position:fixed;left:0;bottom:0;width:100%;pointer-events:none;z-index:0;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-weight:300;font-size:1.5rem;letter-spacing:-.01em;margin:0}
.titleblock{display:flex;flex-direction:column;gap:2px}
.tag{font-size:.78rem;color:var(--mute);letter-spacing:.02em}
#clock{color:var(--mute);font-size:.95rem}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#sync{color:var(--mute);font-size:.78rem;letter-spacing:.02em;padding:4px 0}
#sync:hover{color:var(--ink)}
#sync.on{color:var(--amber)}
#sync:focus-visible{outline:1px solid var(--amber);outline-offset:3px}

.stage{display:block;width:100%;max-width:min(100%,58vh);aspect-ratio:1;margin:0 auto;position:relative;border-radius:50%;
  -webkit-tap-highlight-color:transparent}
.stage:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
.stage canvas{display:block;width:100%;height:100%}
#tap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:300;font-size:1.9rem;letter-spacing:-.02em;
  color:var(--mute);pointer-events:none}

.cap{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-6px;text-align:center;min-height:5.2rem}
#nowA{font-weight:300;font-size:1.9rem;letter-spacing:-.02em}
#nowB{color:var(--mute);font-size:.92rem;text-transform:lowercase}
.hint{font-size:.88rem;color:var(--mute);margin:10px auto 0;max-width:40ch;text-align:center}
.foot{display:flex;justify-content:center;gap:10px;padding:10px 16px 0;font-size:.8rem;letter-spacing:.04em;color:var(--mute)}
.foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}
.foot a:hover,.foot a:focus-visible{color:var(--amber);border-bottom-color:currentColor;outline:none}
</style>

</head>
<body>
<canvas id="bench" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="titleblock">
      <h1>nebbia</h1>
      <span class="tag">neverending dub techno</span>
    </div>
    <div class="side">
      <span id="clock" hidden>00:00:00</span>
      <button id="sync" type="button" aria-label="MIDI clock sync: off">sync off</button>
    </div>
  </header>

  <button class="stage" id="toggle" type="button" aria-pressed="false" aria-label="Start">
    <canvas id="dial" aria-hidden="true"></canvas>
    <span id="tap">tap</span>
  </button>

  <div class="cap">
    <span id="nowA" hidden>f min</span>
    <span id="nowB" hidden>track 1, bar 1 of 96 at 118 bpm</span>
    <p class="hint" id="hint">Tap the dial. A dub techno mix starts, and it never plays the same way twice.</p>
  </div>

  <footer class="foot"><a href="https://github.com/phonk/nebbia">source on github</a><span aria-hidden="true">·</span><a href="https://phonk.github.io/">phonk</a></footer>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const chance = p => Math.random() < p;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const KEYS = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  const CHORDS = [[0, 3, 7, 10], [0, 3, 7, 10, 14], [0, 7, 10, 15], [0, 5, 7, 10], [0, 3, 10, 14], [0, 7, 15, 17], [0, 3, 7, 14]];
  const BASS_PATTERNS = [[2, 6, 10, 14], [3, 6, 11, 14], [2, 7, 10], [6, 14], [2, 3, 10, 11], [3, 10], [2, 6, 11]];
  
  let ac = null, mix, master, noiseBuf, irBuf, crackleBuf;
  let decks = [], cur = 0, curL = 96, curT = 16, trackNo = 0;
  let step = 0, nextTime = 0, baseBpm = 118, t0 = 0, bpmNow = 118;
  let playing = false, worker = null, fallbackTimer = null, silentEl = null;
  const events = [];

  /* ---------- sound sources ---------- */
  let bed = null, tape = null;
  function tanhCurve(k, out) {
    const c = new Float32Array(1025);
    for (let i = 0; i < 1025; i++) c[i] = Math.tanh((i / 512 - 1) * k) * out;
    return c;
  }
  function makeNoise(seconds) {
    const b = ac.createBuffer(1, ac.sampleRate * seconds, ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function makeCrackle(seconds) {
    const b = ac.createBuffer(1, ac.sampleRate * seconds, ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() < 0.0007 ? (Math.random() * 2 - 1) : 0;
    return b;
  }
  function makeImpulse(seconds) {
    const sr = ac.sampleRate, n = Math.floor(sr * seconds);
    const b = ac.createBuffer(2, n, sr);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      let y = 0;
      const pre = Math.floor(sr * 0.018);
      for (let i = pre; i < n; i++) {
        const t = i / sr;
        const x = (Math.random() * 2 - 1) * Math.exp(-t * 1.25);
        const a = 0.55 * Math.exp(-t * 0.9) + 0.06;   // tail gets darker as it decays
        y += a * (x - y);
        d[i] = y;
      }
    }
    return b;
  }

  /* ---------- a deck: one track with its own echo and room ---------- */
  class Deck {
    constructor(i) {
      this.i = i;
      const g = v => { const n = ac.createGain(); n.gain.value = v; return n; };
      this.out = g(0);
      this.lp = ac.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 18000; this.lp.Q.value = 0.5;
      this.pre = g(1);
      this.pre.connect(this.lp); this.lp.connect(this.out); this.out.connect(mix);
      this.duck = g(1); this.duck.connect(this.pre);
      this.drum = g(1); this.drum.connect(this.pre);
      this.chordBus = g(1); this.chordBus.connect(this.duck);
      /* grit stage: stabs are overdriven before they reach the echo */
      this.drive = g(3); this.dirt = ac.createWaveShaper(); this.dirtOut = g(0.5);
      const dc = new Float32Array(1025);
      for (let i = 0; i < 1025; i++) { const x = (i / 512 - 1) * 3; dc[i] = Math.tanh(x + 0.18 * x * x) ; }
      this.dirt.curve = dc; this.dirt.oversample = '2x';
      this.drive.connect(this.dirt); this.dirt.connect(this.dirtOut);
      const bq = (type, f, q) => { const n = ac.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
      const lfo = (f, depth, target) => { const o = ac.createOscillator(); o.frequency.value = f; const og = g(depth); o.connect(og); og.connect(target); o.start(); };
      this.fxIn = g(1); { const dc = bq('highpass', 35, 0.5); this.dirtOut.connect(dc); dc.connect(this.fxIn); }
      /* tape warble: wow, slow drift and flutter on the chords */
      this.warb = ac.createDelay(0.2); this.warb.delayTime.value = 0.03;
      this.warbDepth = g(1); this.warbDepth.connect(this.warb.delayTime);
      lfo(rnd(0.35, 0.6), 0.0028, this.warbDepth); lfo(rnd(0.07, 0.13), 0.006, this.warbDepth); lfo(rnd(6, 8.5), 0.00006, this.warbDepth);
      this.fxIn.connect(this.warb);
      /* phaser */
      const phDepth = g(600); { const o = ac.createOscillator(); o.frequency.value = rnd(0.05, 0.2); o.connect(phDepth); o.start(); }
      let node = this.warb;
      for (let k = 0; k < 4; k++) { const ap = bq('allpass', 900 + k * 500, 0.7); phDepth.connect(ap.frequency); node.connect(ap); node = ap; }
      this.pre2 = g(1); this.warb.connect(this.pre2); { const pm = g(0.6); node.connect(pm); pm.connect(this.pre2); }
      this.pre2.connect(this.chordBus);

      this.delay = ac.createDelay(2.5);
      this.delaySend = g(0.5);
      this.fb = g(0.6);
      this.fbHP = ac.createBiquadFilter(); this.fbHP.type = 'highpass'; this.fbHP.frequency.value = 280; this.fbHP.Q.value = -3;
      this.fbLP = ac.createBiquadFilter(); this.fbLP.type = 'lowpass'; this.fbLP.frequency.value = 2200; this.fbLP.Q.value = -3;
      /* tape-style saturation inside the loop: the echo can swell but never run away */
      this.sat = ac.createWaveShaper();
      const curve = new Float32Array(1025);
      for (let i = 0; i < 1025; i++) { const x = (i / 512 - 1) * 2; curve[i] = Math.tanh(x) * 0.9; }
      this.sat.curve = curve;
      this.delayOut = g(0.7);
      this.pan = ac.createStereoPanner ? ac.createStereoPanner() : g(1);
      this.chordBus.connect(this.delaySend); this.delaySend.connect(this.delay);
      this.delay.connect(this.fbHP); this.fbHP.connect(this.fbLP); this.fbLP.connect(this.fb); this.fb.connect(this.sat); this.sat.connect(this.delay);
      this.delay.connect(this.delayOut); this.delayOut.connect(this.pan); this.pan.connect(this.duck);
      if (this.pan.pan) {
        this.panLfo = ac.createOscillator(); this.panLfo.frequency.value = rnd(0.04, 0.09);
        const depth = g(0.55); this.panLfo.connect(depth); depth.connect(this.pan.pan); this.panLfo.start();
      }

      this.rev = ac.createConvolver(); this.rev.buffer = irBuf;
      this.revSend = g(0.3); this.revOut = g(0.55);
      this.chordBus.connect(this.revSend); this.delay.connect(this.revSend);
      this.revSend.connect(this.rev); this.rev.connect(this.revOut); this.revOut.connect(this.pre);

      lfo(0.23, 0.0018, this.delay.delayTime);   /* tape echo wobble */
      this.track = null; this.pad = null;
    }

    load(tr, bar, t, fadeBars, barDur, first) {
      this.track = tr; this.startBar = bar; this.dubOut = false;
      this.kickFrom = bar + (first ? 4 : fadeBars); this.kickUntil = Infinity;
      const fade = fadeBars * barDur;
      const o = this.out.gain, f = this.lp.frequency;
      o.cancelScheduledValues(t); o.setValueAtTime(0.0001, t);
      o.linearRampToValueAtTime(1, t + (first ? 2 * barDur : fade));
      f.cancelScheduledValues(t); f.setValueAtTime(first ? 500 : 320, t);
      f.exponentialRampToValueAtTime(18000, t + (first ? 8 * barDur : fade));
      this.delay.delayTime.cancelScheduledValues(t);
      this.delay.delayTime.setValueAtTime(tr.delaySteps * barDur / 16, t);
      this.fb.gain.cancelScheduledValues(t); this.fb.gain.setValueAtTime(tr.fb, t);
      this.fbLP.frequency.setValueAtTime(tr.fbTone, t);
      this.delaySend.gain.setValueAtTime(tr.delaySend, t);
      this.revSend.gain.setValueAtTime(tr.revSend, t);
      this.drive.gain.setValueAtTime(tr.drive, t);
      this.warbDepth.gain.setValueAtTime(tr.warble, t);
      this.startPad(t);
    }

    startPad(t) {
      const tr = this.track;
      if (!tr.padLevel) return;
      const gain = ac.createGain(); gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(tr.padLevel, t + 12);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = tr.padCut; f.Q.value = 1.5;
      const lfo = ac.createOscillator(); lfo.frequency.value = rnd(0.03, 0.08);
      const lg = ac.createGain(); lg.gain.value = tr.padCut * 0.45; lfo.connect(lg); lg.connect(f.frequency); lfo.start(t);
      const oscs = [lfo];
      [0, 7, tr.chord[1] + 12].forEach((iv, i) => {
        const o = ac.createOscillator(); o.type = i === 2 ? 'triangle' : 'sawtooth';
        o.frequency.value = mtof(tr.base + iv); o.detune.value = rnd(-9, 9);
        o.connect(f); o.start(t); oscs.push(o);
      });
      f.connect(gain); gain.connect(this.duck); gain.connect(this.revSend);
      this.pad = { gain, oscs };
    }
    /* once a bar the echo's tone moves a little */
    morph(t, tr) {
      this.fbLP.frequency.setTargetAtTime(clamp(tr.fbTone * Math.pow(2, 1.1 * Math.sin(t / tr.p2 + 1)), 600, 4500), t, 1);
    }
    stopPad(t) {
      if (!this.pad) return;
      const p = this.pad; this.pad = null;
      p.gain.gain.cancelScheduledValues(t); p.gain.gain.setTargetAtTime(0, t, 2.5);
      p.oscs.forEach(o => o.stop(t + 14));
    }

    /* the mix-out: kick and bass leave, the chords sink into their own echo */
    beginOut(bar, t, halfBars, barDur) {
      this.kickUntil = bar; this.dubOut = true;
      const hs = halfBars * barDur, o = this.out.gain, f = this.lp.frequency;
      o.cancelScheduledValues(t); o.setValueAtTime(1, t);
      o.linearRampToValueAtTime(0.7, t + hs * 0.5);
      o.linearRampToValueAtTime(0.0001, t + hs + 2 * barDur);
      f.cancelScheduledValues(t); f.setValueAtTime(18000, t);
      f.exponentialRampToValueAtTime(600, t + hs);
      this.fb.gain.setTargetAtTime(0.74, t, hs / 3);
      this.stopPad(t + hs * 0.5);
    }
    end(t) { this.track = null; this.stopPad(t); }

    playStep(bar, s, t, sd) {
      const tr = this.track; if (!tr) return;
      const rb = bar - this.startBar;
      const low = bar >= this.kickFrom && bar < this.kickUntil && !tr.breaks.has(rb);

      if (s === 0) {
        this.morph(t, tr);
        this.delay.delayTime.setTargetAtTime(tr.delaySteps * sd, t, 0.6);
        if (!this.dubOut) this.fb.gain.setTargetAtTime(clamp(tr.fb + 0.07 * Math.sin(t / tr.fbPeriod), 0.3, 0.7), t, 1);
        if (rb > 0 && rb % 16 === 0) mutate(tr.stab[chance(0.5) ? 0 : 1]);
      }
      if (low && s % 4 === 0) this.kick(t, tr);
      if (low && tr.bassSteps.includes(s) && chance(0.94)) this.bass(t, sd, tr);
      if (!tr.hatsOff.has(Math.floor(rb / 8))) {
        if (s % 4 === 2 && tr.openHat) this.hat(t, tr.hatLevel, tr.hatDecay * 2.2, tr.hatTone);
        else if (chance(tr.hatMask[s])) this.hat(t, tr.hatLevel * rnd(0.3, 0.7), tr.hatDecay, tr.hatTone * 1.15);
      }
      if (tr.clap && low && (s === 4 || s === 12)) this.clap(t);
      const vel = tr.stab[rb % 2][s];
      if (vel > 0 && chance(0.9)) {
        const shift = tr.prog[Math.floor(rb / tr.progLen) % tr.prog.length];
        this.stab(t, vel, shift, tr, s);
      }
    }

    kick(t, tr) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(tr.kickTune * 3.2, t);
      o.frequency.exponentialRampToValueAtTime(tr.kickTune, t + 0.09);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.85, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.001, t + tr.kickDecay);
      o.connect(g); g.connect(this.drum); o.start(t); o.stop(t + tr.kickDecay + 0.05);
      this.duck.gain.setTargetAtTime(0.3, t, 0.004);
      this.duck.gain.setTargetAtTime(1, t + 0.045, tr.pump);
      if (bed) { bed.gain.setTargetAtTime(0.4, t, 0.004); bed.gain.setTargetAtTime(1, t + 0.045, 0.13); }
      events.push({ t, kind: 'kick' });
    }

    bass(t, sd, tr) {
      const iv = chance(0.9) ? 0 : 12;
      const f = mtof(tr.bassNote + iv);
      const o = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain();
      const lp = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o2.type = 'triangle'; o2.frequency.value = f * 2; g2.gain.value = 0.22;
      lp.type = 'lowpass'; lp.frequency.value = tr.bassCut;
      const len = sd * tr.bassLen;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.42, t + 0.01);
      g.gain.setValueAtTime(0.42, t + len); g.gain.setTargetAtTime(0, t + len, 0.04);
      o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(this.duck);
      o.start(t); o2.start(t); o.stop(t + len + 0.4); o2.stop(t + len + 0.4);
    }

    hat(t, level, decay, tone) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = tone;
      const g = ac.createGain();
      g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(0.0005, t + decay);
      src.connect(hp); hp.connect(g); g.connect(this.drum);
      src.start(t, Math.random() * 1.5, decay + 0.05);
    }

    clap(t) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.8;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.13);
      src.connect(bp); bp.connect(g); g.connect(this.chordBus);
      src.start(t, Math.random() * 1.5, 0.2);
    }

    stab(t, vel, shift, tr, s) {
      const drift = 1.2 * Math.sin(t / tr.p1 + tr.ph) + 0.6 * Math.sin(t / tr.p2);
      const cut = clamp(tr.cut * Math.pow(2, drift) * rnd(0.82, 1.2), 140, 5000);
      const f = ac.createBiquadFilter(); f.type = tr.stabType; f.Q.value = tr.stabType === 'bandpass' ? tr.q * 0.4 : tr.q;
      f.frequency.setValueAtTime(Math.min(cut + tr.envAmt * vel, 9000), t);
      f.frequency.exponentialRampToValueAtTime(cut, t + tr.fDecay);
      const g = ac.createGain();
      const n = tr.chord.length * 2;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel * 0.3 / Math.sqrt(n), t + 0.004);
      g.gain.setTargetAtTime(0, t + 0.008, tr.decay / 3);
      const end = t + tr.decay * 3 + 0.2;
      for (const iv of tr.chord) for (const d of [-tr.detune, tr.detune]) {
        const o = ac.createOscillator(); o.type = tr.wave;
        o.frequency.value = mtof(tr.base + iv + shift); o.detune.value = d + rnd(-2, 2);
        o.connect(f); o.start(t); o.stop(end);
      }
      const ns = ac.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
      const ng = ac.createGain(); ng.gain.value = n * tr.grit * 0.4;
      ns.connect(ng); ng.connect(f); ns.start(t, Math.random() * 1.5); ns.stop(end);
      f.connect(g); g.connect(this.drive);
      events.push({ t, kind: 'stab', vel, di: this.i, s, d: this.delay.delayTime.value, fb: this.fb.gain.value,
                    fog: clamp(Math.log2(cut / 140) / 5.2, 0, 1) });
    }
  }

  /* ---------- track generator ---------- */
  function weightedStep() {
    const r = Math.random();
    if (r < 0.45) return pick([2, 6, 10, 14]);
    if (r < 0.9) return pick([1, 3, 5, 7, 9, 11, 13, 15]);
    return pick([0, 4, 8, 12]);
  }
  function mutate(p) {
    const on = []; p.forEach((v, i) => { if (v > 0) on.push(i); });
    if (on.length > 1 || (on.length === 1 && chance(0.5))) p[pick(on)] = 0;
    let s; do { s = weightedStep(); } while (p[s] > 0);
    p[s] = rnd(0.6, 1);
  }
  function newTrack(prevRoot, len, trans) {
    const root = prevRoot == null ? Math.floor(Math.random() * 12)
                                  : (prevRoot + pick([0, 7, 7, 5, 5, 3, 9, 2, 10])) % 12;
    const b1 = new Array(16).fill(0);
    for (let i = pick([1, 2, 2, 3, 3, 4]); i > 0; i--) b1[weightedStep()] = rnd(0.6, 1);
    const b2 = b1.slice(); if (chance(0.6)) mutate(b2);
    const hatMask = new Array(16).fill(0).map(() => (chance(0.5) ? rnd(0.3, 0.9) : 0));
    const breaks = new Set(), hatsOff = new Set();
    for (let k = 16; k < len - trans; k += 16) {
      if (k >= trans + 16 && chance(0.3)) { const n = pick([4, 4, 8]); for (let i = 1; i <= n; i++) breaks.add(k - i); }
